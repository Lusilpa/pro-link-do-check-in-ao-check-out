<style>
  /* Identidade visual unificada Pro-Link */
  .auth-page-wrapper {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    border-radius: 0;
    overflow: hidden;
    background-color: #2a2b36;
  }

  .auth-image-panel {
    background-image: url('assets/img/fundo-login-manaus.jpg');
    background-size: cover;
    background-position: center;
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .auth-image-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(20, 21, 28, 0.5);
  }

  .mobile-logo {
    position: relative;
    z-index: 2;
    max-width: 180px;
  }

  .auth-form-panel {
    padding: 2.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
  }

  .desktop-logo {
    max-width: 220px;
    margin: 0 auto 2rem auto;
  }

  @media (min-width: 992px) {
    .auth-page-wrapper {
      flex-direction: row;
    }
    .auth-image-panel {
      flex: 1.2; 
      min-height: auto;
    }
    .auth-image-panel::before {
      background: transparent;
    }
    .auth-form-panel {
      flex: 1;
      padding: 3.5rem;
      background-image: linear-gradient(rgba(42, 43, 54, 0.92), rgba(42, 43, 54, 0.95)), url('assets/img/fundo-login-manaus.jpg');
      background-size: cover;
      background-position: left;
    }
  }

  .auth-input-group {
    border: 1px solid #555866;
    border-radius: 50px;
    background-color: transparent;
    transition: all 0.3s ease;
  }

  .auth-input-group:focus-within {
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
  }

  .auth-input-group .input-group-text {
    background-color: transparent;
    border: none;
    color: #ffffff !important;
    padding-left: 1.5rem;
  }

  .auth-input-group .form-control,
  .auth-input-group .form-select {
    background-color: transparent;
    border: none;
    color: #ffffff;
    padding: 0.8rem 1.5rem 0.8rem 0.5rem;
  }

  /* Estilização para o select nativo do Bootstrap no tema dark */
  .auth-input-group .form-select {
    padding-right: 2.5rem;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://w3.org' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
  }

  .auth-input-group .form-select option {
    background-color: #2a2b36;
    color: #ffffff;
  }

  .auth-input-group .form-control:focus,
  .auth-input-group .form-select:focus {
    box-shadow: none;
    background-color: transparent;
    color: #ffffff;
  }

  .placeholder-white::placeholder {
    color: rgba(255, 255, 255, 0.45) !important;
    opacity: 1;
  }

  .btn-prolink-pill {
    background-color: #007bff; 
    color: #ffffff;
    font-weight: 600;
    padding: 12px;
    border-radius: 50px;
    border: none;
    transition: background-color 0.2s;
  }

  .btn-prolink-pill:hover {
    background-color: #0056b3;
    color: #ffffff;
  }

  .text-muted-custom {
    color: #a0a4b8;
    font-size: 0.85rem;
  }

  .auth-link {
    color: #007bff;
    text-decoration: none;
    font-size: 0.85rem;
  }
  .auth-link:hover {
    text-decoration: underline;
  }
</style>

<div class="auth-page-wrapper">
  
  <div class="auth-image-panel">
    <img src="assets/img/logo-pro-link.png" alt="Pro-Link Logo" class="mobile-logo d-lg-none" onerror="this.style.display='none';">
  </div>

  <div class="auth-form-panel">
    <img src="assets/img/logo-pro-link.png" alt="Pro-Link Logo" class="desktop-logo d-none d-lg-block" onerror="this.style.display='none';">

    <form id="registerForm" action="#" method="POST" enctype="multipart/form-data">
      
      <div class="mb-3">
        <label for="profileType" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">Tipo de conta</label>
        <div class="input-group auth-input-group">
          <span class="input-group-text"><i class="bi bi-tags"></i></span>
          <select id="profileType" name="profile_type" class="form-select" required onchange="adjustFormFields()">
            <option value="" disabled selected>Selecione o tipo de conta</option>
            <option value="Público Geral">Público Geral</option>
            <option value="profissional">Profissional (Sistema Confea/Crea)</option>
            <option value="universitario">Universitário / Pesquisador (Sistema Confea/Crea)</option>
            <option value="empresa">Empresa / Instituição</option>
            <option value="terceiros">Terceiro (Contratante Geral)</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label id="labelName" for="fullName" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">Nome completo</label>
        <div class="input-group auth-input-group">
          <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
          <input type="text" id="fullName" name="name" class="form-control placeholder-white" placeholder="Digite seu nome completo" required>
        </div>
      </div>

      <div class="mb-3">
        <label id="labelDocument" for="documentNumber" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">CPF</label>
        <div class="input-group auth-input-group">
          <span id="iconDocument" class="input-group-text"><i class="bi bi-file-earmark-person"></i></span>
          <input type="text" id="documentNumber" name="document_number" class="form-control placeholder-white" placeholder="000.000.000-00" required>
        </div>
      </div>

      <!-- Campo Registro CREA (Apenas para Profissionais) -->
      <div id="creaGroup" class="mb-3">
        <label for="creaRecord" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">Registro CREA-AM</label>
        <div class="input-group auth-input-group">
          <span class="input-group-text"><i class="bi bi-patch-check"></i></span>
          <input type="text" id="creaRecord" name="crea_record" class="form-control placeholder-white" placeholder="Digite o número do seu registro">
        </div>
      </div>

      <!-- CAMPOS ESPECÍFICOS: Universitário / Pesquisador -->
      <div id="studentFields" style="display: none;">
        
        <!-- Nível Acadêmico (Estilo Janela/Select) -->
        <div class="mb-3">
          <label for="studentLevel" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">Nível Acadêmico</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text"><i class="bi bi-mortarboard-fill"></i></span>
            <select id="studentLevel" name="student_level" class="form-select">
              <option value="" disabled selected>Selecione o nível acadêmico</option>
              <option value="tecnico">Técnico</option>
              <option value="bacharel">Bacharelado</option>
              <option value="licenciatura">Licenciatura</option>
              <option value="mestrado">Mestrado</option>
              <option value="doutorado">Doutorado</option>
              <option value="mba">MBA</option>
              <option value="pos">Pós-Graduação / Especialização</option>
            </select>
          </div>
        </div>

        <!-- Modalidade / Curso do Sistema CREA/Confea -->
        <div class="mb-3">
          <label for="studentModality" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">Modalidade / Curso (Sistema CREA/Confea)</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text"><i class="bi bi-mortarboard"></i></span>
            <input type="text" id="studentModality" name="student_modality" class="form-control placeholder-white" placeholder="Ex: Eng. Civil, Eng. Elétrica, Agronomia...">
          </div>
        </div>

        <!-- Instituição de Ensino -->
        <div class="mb-3">
          <label for="institutionEnsino" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">Instituição de Ensino</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text"><i class="bi bi-building"></i></span>
            <input type="text" id="institutionEnsino" name="institution_ensino" class="form-control placeholder-white" placeholder="Ex: UFAM,  UEA...">
          </div>
        </div>

        <!-- R.A. (Registro Acadêmico) -->
        <div class="mb-3">
          <label for="studentRA" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">R.A. (Registro Acadêmico)</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text"><i class="bi bi-card-text"></i></span>
            <input type="text" id="studentRA" name="student_ra" class="form-control placeholder-white" placeholder="Digite o número do seu R.A.">
          </div>
        </div>

        <!-- Anexar documento de matrícula -->
        <div class="mb-3">
          <label for="enrollmentDoc" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">Anexar Documento de Matrícula</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text"><i class="bi bi-file-earmark-arrow-up"></i></span>
            <input type="file" id="enrollmentDoc" name="enrollment_doc" class="form-control text-white" accept=".pdf,.jpg,.png">
          </div>
          <div class="form-text text-muted-custom ms-1 mt-1">Envie comprovante recente (PDF ou Imagem).</div>
        </div>

      </div>

      <div class="mb-3">
        <label for="email" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">E-mail</label>
        <div class="input-group auth-input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" id="email" name="email" class="form-control placeholder-white" placeholder="Digite seu melhor e-mail" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">Senha</label>
        <div class="input-group auth-input-group">
          <span class="input-group-text"><i class="bi bi-key"></i></span>
          <input type="password" id="password" name="password" class="form-control placeholder-white" placeholder="Crie uma senha forte" required>
        </div>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label text-white fw-medium ms-1 mb-2" style="font-size: 0.9rem;">Confirmar senha</label>
        <div class="input-group auth-input-group">
          <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
          <input type="password" id="confirmPassword" name="confirm_password" class="form-control placeholder-white" placeholder="Repita a senha criada" required>
        </div>
      </div>

      <div class="mb-4 ms-1">
        <div class="form-check">
          <input class="form-check-input bg-transparent border-secondary" type="checkbox" id="lgpdCheck" required>
          <label class="form-check-label text-muted-custom mt-1" for="lgpdCheck">
            Li e aceito os <a href="#termos-e-lgpd" class="auth-link">Termos de Uso</a> e a <a href="#termos-e-lgpd" class="auth-link">Política de Privacidade</a> (LGPD).
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-prolink-pill w-100">
        Criar minha conta
      </button>

      <div class="text-center mt-4">
        <span class="text-muted-custom">Já possui cadastro?</span>
        <a href="#auth" class="auth-link fw-semibold ms-1">Fazer login</a>
      </div>

      <!-- Rodapé Universal Pro-Link / Equipe Otho -->
      <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
        <small class="text-muted-custom" style="font-size: 0.75rem;">
          Copyright &copy; 2026 - Desenvolvido por Equipe Otho. Todos os direitos reservados.
        </small>
      </div>
      
    </form>
  </div>
</div>

<script>
  function adjustFormFields() {
    const profileType = document.getElementById('profileType').value;
    const labelName = document.getElementById('labelName');
    const fullNameInput = document.getElementById('fullName');
    const labelDocument = document.getElementById('labelDocument');
    const docInput = document.getElementById('documentNumber');
    const iconDocument = document.getElementById('iconDocument');
    
    const creaGroup = document.getElementById('creaGroup');
    const creaInput = document.getElementById('creaRecord');

    const studentFields = document.getElementById('studentFields');
    const studentModality = document.getElementById('studentModality');
    const institutionEnsino = document.getElementById('institutionEnsino');
    const studentRA = document.getElementById('studentRA');
    const enrollmentDoc = document.getElementById('enrollmentDoc');

    // Reseta padrões básicos
    labelName.innerText = "Nome completo";
    fullNameInput.placeholder = "Digite seu nome completo";
    labelDocument.innerText = "CPF";
    docInput.placeholder = "000.000.000-00";
    iconDocument.innerHTML = '<i class="bi bi-file-earmark-person"></i>';

    // Oculta blocos condicionais por padrão
    creaGroup.style.display = 'none';
    creaInput.removeAttribute('required');
    
    studentFields.style.display = 'none';
    if (studentModality) studentModality.removeAttribute('required');
    if (institutionEnsino) institutionEnsino.removeAttribute('required');
    if (studentRA) studentRA.removeAttribute('required');

    if (profileType === 'empresa') {
        labelName.innerText = "Razão Social";
        fullNameInput.placeholder = "Digite a razão social da empresa / Nome institucional";
        labelDocument.innerText = "CNPJ";
        docInput.placeholder = "00.000.000/0000-00";
    } else if (profileType === 'profissional') {
        creaGroup.style.display = 'block';
        creaInput.setAttribute('required', 'required');
    } else if (profileType === 'universitario') {
        studentFields.style.display = 'block';
        if (studentModality) studentModality.setAttribute('required', 'required');
        if (institutionEnsino) institutionEnsino.setAttribute('required', 'required');
        if (studentRA) studentRA.setAttribute('required', 'required');
    }
  }

  // Executa imediatamente na carga dinâmica do AJAX sem depender de evento
  adjustFormFields();
</script>
