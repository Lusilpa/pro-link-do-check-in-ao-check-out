<style>
  /* 1. O Fundo Infinito: Ignora os limites do index.html e cobre a tela toda */
  .feed-fullscreen-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: var(--prolink-bg-darker);
    z-index: -999; /* Fica atrás de absolutamente tudo */
  }

  /* 2. Reset e Configuração Base da Tela */
  .feed-page-wrapper {
    background-color: transparent;
    min-height: 100vh;
    color: var(--prolink-light);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    position: relative;
  }

  /* Container Principal - Empurrado pela barra lateral no Desktop */
  .feed-main-container {
    padding-top: 2rem;
    padding-bottom: 100px; /* Espaço para a navbar inferior */
    padding-right: 2rem;
    margin-left: 95px; /* Compensa a largura da pl-lateral (75px + margem) */
    display: grid;
    grid-template-columns: 1fr 320px; /* Coluna 1 flexível, Coluna 2 fixa (320px) */
    gap: 2rem;
    max-width: 1400px;
  }

  /* Coluna da Esquerda (Busca e Cards) */
  .feed-column-left {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* Input de Busca do Figma */
  .pl-search-bar {
    background-color: transparent;
    border: 1px solid var(--prolink-blue);
    border-radius: 12px;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    color: var(--prolink-blue);
    font-size: 1.1rem;
  }

  .pl-search-bar i {
    font-size: 1.4rem;
  }

  .pl-search-bar input {
    background-color: transparent;
    border: none;
    color: var(--prolink-light);
    width: 100%;
    outline: none;
  }

  .pl-search-bar input::placeholder {
    color: var(--prolink-blue);
    opacity: 0.8;
  }

  /* Coluna da Direita (Calendário e Filtros) */
  .feed-column-right {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* Mobile e Tablets menores */
  @media (max-width: 991px) {
    .feed-main-container {
      grid-template-columns: 1fr; /* Colapsa para uma coluna única */
      margin-left: 0;
      padding: 85px 1rem 100px 1rem; /* Padding top para não bater na lateral mobile */
    }

    /* Faz a coluna direita (Calendário e Filtro) desaparecer no mobile/tablet */
    .feed-column-right {
      display: none;
    }
  }
</style>

<!-- A Mágica: Fundo fixo preenchendo a tela toda -->
<div class="feed-fullscreen-bg"></div>

<!-- ========================================== -->
<!-- MODAL / OFFCANVAS PARA MOBILE (Filtros e Calendário) -->
<!-- ========================================== -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileFiltersOffcanvas" aria-labelledby="mobileFiltersLabel" style="background-color: var(--prolink-bg-darker); border-right: 1px solid var(--prolink-blue); width: 360px; max-width: 90vw;">
  
  <div class="offcanvas-header" style="border-bottom: 1px solid var(--prolink-dark);">
    <h5 class="offcanvas-title" id="mobileFiltersLabel" style="color: var(--prolink-blue); font-weight: 700;">
      <i class="bi bi-calendar2-week"></i> Explorar
    </h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  
  <div class="offcanvas-body" style="display: flex; flex-direction: column; gap: 1.5rem; overflow-x: hidden; padding: 1.5rem 1rem;">
    
    <!-- Injeção do Calendário no Mobile -->
    <div id="mobile-calendar-inject-area"></div>

    <!-- Injeção dos Filtros no Mobile -->
    <div id="mobile-filters-inject-area"></div>

  </div>
</div>
<!-- ========================================== -->

<div class="feed-page-wrapper">
  
  <!-- Injeção do Menu Lateral (Esquerda no PC, Topo no Mobile) -->
  <div id="lateral-inject-area"></div>

  <!-- Layout em Grid (Duas Colunas) -->
  <div class="feed-main-container">
    
    <!-- COLUNA DA ESQUERDA: Busca e Publicações -->
    <div class="feed-column-left">
      
      <!-- Barra de Pesquisa -->
      <div class="pl-search-bar">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Pesquisa publicações">
      </div>

      <!-- Container onde os cards serão injetados -->
      <div id="feed-posts-container">
        <!-- Loading state enquanto busca do banco -->
        <div class="text-center text-muted py-4">
           Carregando publicações...
        </div>
      </div>

    </div>

    <!-- COLUNA DA DIREITA: Calendário e Filtros -->
    <div class="feed-column-right">
      
      <!-- Componente Calendário -->
      <div id="calendar-inject-area"></div>

      <!-- Botão/Cabeçalho do Acordeão de Filtros -->
      <div id="btn-toggle-filters" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center; background-color: transparent; border: 1px solid var(--prolink-blue); border-radius: 12px; padding: 1.2rem 1.5rem; transition: all 0.2s;">
        <span style="color: var(--prolink-blue); font-size: 1.4rem; font-weight: 800; letter-spacing: 1px;">FILTROS</span>
        <i id="filter-arrow-icon" class="bi bi-chevron-down" style="color: var(--prolink-blue); font-size: 1.8rem; transition: transform 0.3s ease;"></i>
      </div>

      <!-- Injeção do componente de filtros detalhado (Inicia oculto) -->
      <div id="filters-inject-area" style="display: none;"></div>

    </div>

  </div>
</div>

<script>
  $(document).ready(function() {
    
    // 1. Carrega a Barra Lateral
    $('#lateral-inject-area').load('src/entities/feed/layouts/lateral.html', function(response, status, xhr) {
        if(status == "error") console.error("Erro ao carregar menu lateral:", xhr.status, xhr.statusText);
    });
    
    // ==========================================
    // CARREGAMENTO DESKTOP (Coluna da Direita)
    // ==========================================
    $('#calendar-inject-area').load('src/entities/feed/layouts/calendar.html', function(response, status, xhr) {
      if(status == "error") {
        console.error("Erro ao carregar o calendário:", xhr.status, xhr.statusText);
      } else {
        var tentativas = 0;
        var tentarRenderDesktop = function() {
          if (typeof renderProLinkCalendar === "function") {
            renderProLinkCalendar();
          } else if (tentativas++ < 10) {
            setTimeout(tentarRenderDesktop, 100);
          }
        };
        setTimeout(tentarRenderDesktop, 100);
      }
    });

    $('#filters-inject-area').load('src/entities/feed/layouts/filter-feed.html');

    // Lógica de clique para ABRIR / FECHAR os Filtros no Desktop
    $('#btn-toggle-filters').on('click', function() {
      $('#filters-inject-area').slideToggle(300);
      $('#filter-arrow-icon').toggleClass('bi-chevron-down bi-chevron-up');
    });

    // ==========================================
    // CARREGAMENTO MOBILE (Janela Offcanvas)
    // ==========================================
    $('#mobile-calendar-inject-area').load('src/entities/feed/layouts/calendar.html', function(response, status, xhr) {
      if(status !== "error") {
        var tentativas = 0;
        var tentarRenderMobile = function() {
          if (typeof renderProLinkCalendar === "function") {
            renderProLinkCalendar();
          } else if (tentativas++ < 10) {
            setTimeout(tentarRenderMobile, 100);
          }
        };
        setTimeout(tentarRenderMobile, 100);
      }
    });

    $('#mobile-filters-inject-area').load('src/entities/feed/layouts/filter-feed.html');


    // ==========================================
    // MOCK DE POSTAGENS (Corrigido para usar Variáveis Globais)
    // ==========================================
    setTimeout(() => {
      const mockHtml = `
        <!-- Card 1 -->
        <div class="pl-feed-card" style="background-color: var(--prolink-bg-darker); border: 1px solid var(--prolink-blue); border-left: 4px solid var(--prolink-blue); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);">
          <div class="pl-feed-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <div class="pl-user-info" style="display: flex; align-items: center; gap: 0.8rem;">
              <div class="pl-avatar-teal" style="width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--prolink-blue); display: flex; align-items: center; justify-content: center; color: var(--prolink-blue); font-size: 1.2rem;">
                <i class="bi bi-person-fill"></i>
              </div>
              <div class="pl-user-meta" style="display: flex; flex-direction: column;">
                <h6 style="margin: 0; color: var(--prolink-light); font-size: 0.95rem; font-weight: 700;">LUAN PALMA</h6>
                <span style="color: var(--prolink-light); font-size: 0.85rem; opacity: 0.7;">Software Engineer • 5 min</span>
              </div>
            </div>
            <button style="background: none; border: none; color: var(--prolink-blue); font-size: 1.2rem; cursor: pointer;"><i class="bi bi-three-dots-vertical"></i></button>
          </div>
          <div class="pl-feed-body">
            <h4 style="color: var(--prolink-light); font-size: 1.1rem; font-weight: 700; margin-bottom: 0.75rem;">Pro-Link: Do check-in ao Check-out</h4>
            <p style="color: var(--prolink-light); font-size: 0.95rem; line-height: 1.5; opacity: 0.9;">Finalizamos a estruturação do Agente de Recomendação baseado em NLP para cruzamento semântico de demandas com as áreas do Confea/Crea, garantindo total isonomia e conformidade com o edital sem criar rankings institucionais. O sistema de Cartas Virtuais com carimbo eletrônico também está integrado via SMTP.</p>
          </div>
          <div class="pl-feed-footer" style="display: flex; gap: 1.5rem; color: var(--prolink-blue); font-weight: 600;">
            <span><i class="bi bi-heart"></i> 23</span>
            <span><i class="bi bi-chat-text"></i> 12</span>
            <span><i class="bi bi-bar-chart-fill"></i> 312</span>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="pl-feed-card" style="background-color: var(--prolink-bg-darker); border: 1px solid var(--prolink-blue); border-left: 4px solid var(--prolink-blue); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);">
          <div class="pl-feed-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <div class="pl-user-info" style="display: flex; align-items: center; gap: 0.8rem;">
              <div class="pl-avatar-teal" style="width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--prolink-blue); display: flex; align-items: center; justify-content: center; color: var(--prolink-blue); font-size: 1.2rem;">
                <i class="bi bi-person-fill"></i>
              </div>
              <div class="pl-user-meta" style="display: flex; flex-direction: column;">
                <h6 style="margin: 0; color: var(--prolink-light); font-size: 0.95rem; font-weight: 700;">HANNA REIS</h6>
                <span style="color: var(--prolink-light); font-size: 0.85rem; opacity: 0.7;">Software Engineer • 5 min</span>
              </div>
            </div>
            <button style="background: none; border: none; color: var(--prolink-blue); font-size: 1.2rem; cursor: pointer;"><i class="bi bi-three-dots-vertical"></i></button>
          </div>
          <div class="pl-feed-body">
            <h4 style="color: var(--prolink-light); font-size: 1.1rem; font-weight: 700; margin-bottom: 0.75rem;">Validação de ARTs via API do CREA-AM</h4>
            <p style="color: var(--prolink-light); font-size: 0.95rem; line-height: 1.5; opacity: 0.9;">Módulo de integração com a API oficial concluído com sucesso! Agora, o sistema consome CPFs, CNPJs, ARTs e CATs em tempo real para conceder o Selo de Verificação e liberar o carimbo eletrônico das cartas virtuais.</p>
          </div>
          <div class="pl-feed-footer" style="display: flex; gap: 1.5rem; color: var(--prolink-blue); font-weight: 600;">
            <span><i class="bi bi-heart"></i> 23</span>
            <span><i class="bi bi-chat-text"></i> 12</span>
            <span><i class="bi bi-bar-chart-fill"></i> 312</span>
          </div>
        </div>
      `;
      $('#feed-posts-container').html(mockHtml);
    }, 500);

  });
</script>
