<link rel="stylesheet" href="src/pages/styles/portfolio.css">

<div class="pl-portfolio-fullscreen-bg"></div>

<div class="pl-portfolio-page-wrapper">
  <div class="pl-portfolio-main-container">

    <!-- COLUNA ESQUERDA: Sidebar do Profissional -->
    <aside class="pl-portfolio-sidebar">
      <div class="pl-portfolio-card">
        <div class="pl-portfolio-avatar-container">
          <i class="bi bi-person-bounding-box"></i>
        </div>
        <h2 class="pl-portfolio-name" id="portfolioName">Carregando...</h2>
        <h4 class="pl-portfolio-title" id="portfolioTitle">...</h4>
        
        <div class="pl-portfolio-badges" id="portfolioBadges">
          <!-- Selos injetados via JS -->
        </div>

        <div class="pl-portfolio-links" id="portfolioLinks">
          <!-- Links injetados via JS -->
        </div>

        <button class="pl-btn-connect" id="btnConnect" onclick="alert('Funcionalidade de mensagem em desenvolvimento.')">
          <i class="bi bi-chat-dots-fill"></i> Enviar Mensagem
        </button>
      </div>
    </aside>

    <!-- COLUNA DIREITA: Conteúdo Principal -->
    <main class="pl-portfolio-content">
      
      <!-- Seção: Sobre Mim -->
      <div class="pl-portfolio-card pl-portfolio-section">
        <h3 class="pl-section-title"><i class="bi bi-file-earmark-person"></i> Sobre Mim</h3>
        <p class="pl-section-text" id="portfolioAbout">Carregando informações...</p>
      </div>

      <!-- Seção: Competências -->
      <div class="pl-portfolio-card pl-portfolio-section">
        <h3 class="pl-section-title"><i class="bi bi-lightning-charge"></i> Competências Principais</h3>
        <div class="pl-skills-grid" id="portfolioSkills">
          <!-- Skills injetadas via JS -->
        </div>
      </div>

      <!-- Seção: Experiência Profissional -->
      <div class="pl-portfolio-card pl-portfolio-section">
        <h3 class="pl-section-title"><i class="bi bi-briefcase"></i> Experiência Profissional</h3>
        <div class="pl-experience-list" id="portfolioExperience">
          <!-- Experiências injetadas via JS -->
        </div>
      </div>

    </main>

  </div>
</div>

<script src="src/shared/api/portfolio.js"></script>
<script src="src/pages/scripts/portfolio.js"></script>
