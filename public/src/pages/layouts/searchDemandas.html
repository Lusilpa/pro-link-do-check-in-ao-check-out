<link rel="stylesheet" href="src/pages/styles/searchDemandas.css">
<link rel="stylesheet" href="src/entities/demands/styles/cardDemandas.css">

<div class="search-fullscreen-bg"></div>

<!-- OFFCANVAS MOBILE: Filtros -->
<div class="offcanvas offcanvas-bottom" tabindex="-1" id="mobileFiltersOffcanvas" style="background-color: var(--prolink-bg-darker); border-top: 1px solid var(--prolink-blue); height: 85vh;">
  <div class="offcanvas-header" style="border-bottom: 1px solid rgba(43, 140, 255, 0.2);">
    <h5 class="offcanvas-title fw-bold" style="color: var(--prolink-blue);">
      <i class="bi bi-funnel"></i> Filtrar Demandas
    </h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-3" id="mobile-filters-inject-area"></div>
</div>

<!-- OFFCANVAS MOBILE: Detalhes -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="mobileDetailOffcanvas" style="background-color: var(--prolink-bg-darker); border-left: 1px solid var(--prolink-blue); width: 100vw;">
  <div class="offcanvas-header" style="border-bottom: 1px solid rgba(43, 140, 255, 0.2);">
    <h5 class="offcanvas-title text-white fw-bold">Detalhes da Demanda</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-3" id="mobile-detail-inject-area"></div>
</div>

<div class="search-page-wrapper">
  <div class="search-main-container">

    <!-- COLUNA ESQUERDA: Busca e Cards -->
    <div class="search-column-left">
      <button class="mobile-filter-trigger-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileFiltersOffcanvas">
        <i class="bi bi-funnel-fill"></i> Filtrar Demandas
      </button>

      <div class="pl-search-bar">
        <i class="bi bi-search"></i>
        <input type="text" id="demandSearchInput" placeholder="Pesquisar por título ou empresa...">
      </div>

      <p class="pl-results-count" id="resultsCount"></p>

      <div id="demands-cards-container"></div>
    </div>

    <!-- COLUNA DIREITA: Filtro Desktop / Painel Lateral -->
    <div class="search-column-right">
      <div class="search-sticky-filter" id="filterWidgetContainer"></div>
      <div id="detail-panel-container" style="display: none;"></div>
    </div>

  </div>
</div>

<script src="src/pages/scripts/searchDemandas.js"></script>
