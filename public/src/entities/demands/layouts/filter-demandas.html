<link rel="stylesheet" href="src/entities/demands/styles/filter-demandas.css">

<div class="pl-filter-widget">

  <label class="pl-filter-label">Área da Demanda</label>
  <div class="pl-filter-select-wrapper">
    <i class="bi bi-compass"></i>
    <select class="pl-filter-select filterArea">
      <option value="">Todas as áreas</option>
    </select>
  </div>

  <label class="pl-filter-label">Tipo de Demanda</label>
  <div class="pl-filter-select-wrapper">
    <i class="bi bi-tags"></i>
    <select class="pl-filter-select filterTipo">
      <option value="">Todos os tipos</option>
      <option value="PROJETO">Projeto Estrutural</option>
      <option value="CONSULTORIA">Consultoria Técnica</option>
      <option value="ART">Emissão de ART / CAT</option>
      <option value="PERICIA">Perícia e Vistoria</option>
      <option value="ESTAGIO">Estágio</option>
      <option value="MENTORIA">Mentoria</option>
      <option value="PESQUISA">Pesquisa</option>
      <option value="VOLUNTARIADO">Voluntariado</option>
    </select>
  </div>

  <label class="pl-filter-label">Modalidade</label>
  <div class="pl-filter-select-wrapper">
    <i class="bi bi-laptop"></i>
    <select class="pl-filter-select filterModalidade">
      <option value="">Todas</option>
      <option value="PRESENCIAL">Presencial</option>
      <option value="REMOTO">Remoto</option>
      <option value="HIBRIDO">Híbrido</option>
    </select>
  </div>

  <label class="pl-filter-label">Prazo</label>
  <div class="pl-filter-select-wrapper">
    <i class="bi bi-calendar-event"></i>
    <select class="pl-filter-select filterPrazo">
      <option value="">Todos os prazos</option>
      <option value="curto">Até 7 dias</option>
      <option value="medio">Até 30 dias</option>
      <option value="longo">Acima de 30 dias</option>
    </select>
  </div>

  <label class="pl-filter-label">Status</label>
  <div class="pl-filter-select-wrapper">
    <i class="bi bi-flag"></i>
    <!-- status: ENUMs alinhados com a coluna `status` da tabela `demandas` no banco -->
    <select class="pl-filter-select filterStatus">
      <option value="">Todos</option>
      <option value="ABERTA">Aberta</option>
      <option value="FECHADA">Concluída / Fechada</option>
      <option value="CANCELADA">Cancelada</option>
      <option value="SUSPENSA_PELO_CREA">Suspensa (CREA)</option>
    </select>
  </div>

  <button class="pl-btn-apply btnApplyFilter">Aplicar Filtros</button>
  <button class="pl-btn-clear btnClearFilter">Limpar tudo</button>

</div>

<script src="src/entities/demands/scripts/filter-demandas.js"></script>
