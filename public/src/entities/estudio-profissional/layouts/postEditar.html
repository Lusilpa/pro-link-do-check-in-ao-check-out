<link rel="stylesheet" href="src/entities/estudio-profissional/styles/estudio-sub.css">
<link rel="stylesheet" href="src/entities/estudio-profissional/styles/postEditar.css">
<div class="pl-estudio-sub-fullscreen-bg"></div>

<div class="pl-estudio-sub-page-wrapper">
  <div class="pl-estudio-sub-main-container">
    
    <button class="pl-btn-back-estudio" onclick="window.location.hash = '#criacao'">
      <i class="bi bi-arrow-left"></i> Voltar ao Estúdio
    </button>

    <div class="pl-estudio-sub-header">
      <h2 class="pl-estudio-sub-title">Editar Posts</h2>
      <p class="pl-estudio-sub-subtitle">Selecione uma publicação para atualizar suas informações.</p>
    </div>

    <div class="pl-estudio-sub-panel">
      
      <div class="pl-estudio-item-list">
        
        <!-- Loading State -->
        <div id="postEditar-loading" class="pl-estudio-sub-empty-state">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
          </div>
          <p class="mt-3">Buscando suas publicações...</p>
        </div>

        <!-- Empty State -->
        <div id="postEditar-empty" class="pl-estudio-sub-empty-state d-none">
          <i class="bi bi-chat-square-text"></i>
          <h4>Nenhum Post</h4>
          <p>Você ainda não fez nenhuma publicação na comunidade.</p>
        </div>

        <div id="postEditar-list" class="d-none" style="width: 100%; display: flex; flex-direction: column; gap: 1rem;">
            <!-- Posts rendered here -->
        </div>

      </div>

    </div>

  </div>
</div>
<script src="src/entities/estudio-profissional/scripts/postEditar.js"></script>
