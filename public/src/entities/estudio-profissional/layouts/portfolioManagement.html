<link rel="stylesheet" href="src/entities/estudio-profissional/styles/portfolioManagement.css">

<div class="pl-portfolio-panel">
  <div class="pl-portfolio-header">
    <h3 class="pl-portfolio-title">
      <i class="bi bi-briefcase-fill"></i> Gerenciamento de Portfólio
    </h3>
    <p class="pl-portfolio-desc">
      Área dedicada à criação, edição e validação do seu portfólio. Mantenha seus projetos atualizados para atrair novas demandas.
    </p>
  </div>

  <div class="pl-portfolio-actions">
    <button class="pl-portfolio-card" id="actionCreatePortfolio" aria-label="Criar novo projeto no portfólio">
      <i class="bi bi-folder-plus"></i> Criar Projeto
    </button>

    <button class="pl-portfolio-card" id="actionEditPortfolio" aria-label="Editar projetos existentes">
      <i class="bi bi-pencil-square"></i> Editar Portfólio
    </button>

    <button class="pl-portfolio-card" id="actionValidatePortfolio" aria-label="Validar portfólio">
      <i class="bi bi-patch-check"></i> Validar Projetos
    </button>
  </div>
</div>

<script src="src/entities/estudio-profissional/scripts/portfolioManagement.js"></script>
