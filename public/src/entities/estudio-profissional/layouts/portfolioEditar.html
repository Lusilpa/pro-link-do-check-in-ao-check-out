<link rel="stylesheet" href="src/entities/estudio-profissional/styles/estudio-sub.css">
<link rel="stylesheet" href="src/entities/estudio-profissional/styles/portfolioEditar.css">
<div class="pl-estudio-sub-fullscreen-bg"></div>

<div class="pl-estudio-sub-page-wrapper">
  <div class="pl-estudio-sub-main-container">
    
    <button class="pl-btn-back-estudio" onclick="window.location.hash = '#criacao'">
      <i class="bi bi-arrow-left"></i> Voltar ao Estúdio
    </button>

    <div class="pl-estudio-sub-header">
      <h2 class="pl-estudio-sub-title">Editar Portfólio</h2>
      <p class="pl-estudio-sub-subtitle">Selecione um projeto do seu portfólio para atualizar ou remover.</p>
    </div>

    <div class="pl-estudio-sub-panel">
      
      <div class="pl-estudio-item-list">
        
        <!-- Loading State -->
        <div id="portfolioEditar-loading" class="pl-estudio-sub-empty-state">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
          </div>
          <p class="mt-3">Buscando seus projetos...</p>
        </div>

        <!-- Empty State -->
        <div id="portfolioEditar-empty" class="pl-estudio-sub-empty-state d-none">
          <i class="bi bi-folder-x"></i>
          <h4>Nenhum Projeto</h4>
          <p>Você ainda não adicionou nenhum projeto ao seu portfólio.</p>
        </div>

        <div id="portfolioEditar-list" class="d-none" style="width: 100%; display: flex; flex-direction: column; gap: 1rem;">
            <!-- Projetos rendered here -->
        </div>

      </div>

    </div>

  </div>
</div>

<script src="src/entities/estudio-profissional/scripts/portfolioEditar.js"></script>
