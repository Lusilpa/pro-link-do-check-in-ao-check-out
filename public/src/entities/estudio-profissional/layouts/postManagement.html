<link rel="stylesheet" href="src/entities/estudio-profissional/styles/postManagement.css">

<div class="pl-post-mgmt-panel">
  <div class="pl-post-mgmt-header">
    <h3 class="pl-post-mgmt-title">
      <i class="bi bi-newspaper"></i> Gerenciamento de Posts
    </h3>
    <p class="pl-post-mgmt-desc">
      Crie novas publicações, edite conteúdos existentes ou remova posts da plataforma.
    </p>
  </div>

  <div class="pl-post-mgmt-actions">
    <button class="pl-post-card" id="actionCreatePost" aria-label="Criar novo post">
      <i class="bi bi-plus-square"></i> Criar Post
    </button>

    <button class="pl-post-card" id="actionEditPost" aria-label="Editar post existente">
      <i class="bi bi-pencil-square"></i> Editar Post
    </button>

    <button class="pl-post-card pl-post-card--danger" id="actionDeletePost" aria-label="Deletar post">
      <i class="bi bi-trash3"></i> Deletar Post
    </button>
  </div>
</div>

<script src="src/entities/estudio-profissional/scripts/postManagement.js"></script>
