<link rel="stylesheet" href="src/entities/estudio-empresa/styles/demandManagement.css">

<div class="pl-empresa-demand-panel">
  <div class="pl-empresa-demand-header">
    <h3 class="pl-empresa-demand-title">
      <i class="bi bi-briefcase-fill"></i> Gestão de Demandas
    </h3>
    <p class="pl-empresa-demand-desc">
      Publique novas vagas, edite processos seletivos em andamento e encerre demandas preenchidas.
    </p>
  </div>

  <div class="pl-empresa-demand-actions">
    <button class="pl-empresa-demand-card" id="actionCreateDemand" aria-label="Criar nova demanda">
      <i class="bi bi-plus-square"></i> Criar Nova Vaga
    </button>

    <button class="pl-empresa-demand-card" id="actionEditDemand" aria-label="Gerenciar demandas ativas">
      <i class="bi bi-pencil-square"></i> Gerenciar Ativas
    </button>

    <button class="pl-empresa-demand-card pl-empresa-demand-card--danger" id="actionCloseDemand" aria-label="Encerrar demanda">
      <i class="bi bi-x-circle"></i> Encerrar Vaga
    </button>
  </div>
</div>

<script src="src/entities/estudio-empresa/scripts/demandManagement.js"></script>
