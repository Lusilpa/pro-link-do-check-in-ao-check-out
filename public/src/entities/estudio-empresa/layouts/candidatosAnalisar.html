<link rel="stylesheet" href="src/entities/estudio-profissional/styles/estudio-sub.css">

<div class="pl-estudio-sub-fullscreen-bg"></div>

<div class="pl-estudio-sub-page-wrapper">
  <div class="pl-estudio-sub-main-container">
    
    <button class="pl-btn-back-estudio" onclick="window.location.hash = '#painel-empresa'">
      <i class="bi bi-arrow-left"></i> Voltar ao Painel
    </button>

    <div class="pl-estudio-sub-header">
      <h2 class="pl-estudio-sub-title">Analisar Candidatos</h2>
      <p class="pl-estudio-sub-subtitle">Revise os profissionais que se candidataram às suas vagas ativas.</p>
    </div>

    <div class="pl-estudio-sub-panel">
      
      <!-- Filtro por demanda — TODO: Popular via GET /api/demandas?id_empresa={id}&status=ABERTA -->
      <div class="pl-estudio-sub-field">
        <label class="pl-estudio-sub-label" for="filtro-vaga">Filtrar por Vaga</label>
        <select class="pl-estudio-sub-input" id="filtro-vaga" name="filtro_demanda_id" style="appearance: auto;">
          <option value="">Todas as Vagas</option>
          <!-- TODO: Options serão populadas dinamicamente -->
        </select>
      </div>

      <!-- Estado de loading -->
      <div id="candidatos-loading" class="pl-estudio-sub-alert" style="margin-top: 1rem;">
        <i class="bi bi-hourglass-split"></i>
        <span>Carregando candidatos...</span>
      </div>

      <!-- Estado vazio -->
      <div id="candidatos-empty" class="pl-estudio-sub-alert d-none" style="margin-top: 1rem;">
        <i class="bi bi-inbox"></i>
        <span>Nenhum candidato encontrado para o filtro selecionado.</span>
      </div>

      <!-- TODO: GET /api/demonstracoes-interesse?id_empresa={id} — Tabela: demonstracoes_interesse -->
      <!-- JOIN com usuarios (nome), profissionais (categoria_profissional), demandas (titulo) -->
      <div class="pl-estudio-item-list d-none" id="candidatos-list" style="margin-top: 1rem;"></div>

    </div>

  </div>
</div>

<script>
  (function() {
    const filtroEl   = document.getElementById('filtro-vaga');
    const loadingEl  = document.getElementById('candidatos-loading');
    const emptyEl    = document.getElementById('candidatos-empty');
    const listEl     = document.getElementById('candidatos-list');

    /**
     * Renderiza a lista de candidatos (demonstrações de interesse).
     * @param {Array} candidatos — Array de objetos
     * Cada objeto: { id, id_demanda, id_usuario, nome_usuario, categoria_profissional, titulo_demanda, data_interesse, status }
     * status ENUM('ENVIADA','EM_ANALISE','ACEITA','RECUSADA','CANCELADA')
     */
    function renderCandidatos(candidatos) {
      loadingEl.classList.add('d-none');

      if (!candidatos || candidatos.length === 0) {
        emptyEl.classList.remove('d-none');
        listEl.classList.add('d-none');
        return;
      }

      emptyEl.classList.add('d-none');
      listEl.innerHTML = '';

      candidatos.forEach(function(c) {
        var card = document.createElement('div');
        card.className = 'pl-estudio-item-card';
        card.id = 'candidato-' + c.id;
        card.setAttribute('data-interesse-id', c.id);
        card.setAttribute('data-usuario-id', c.id_usuario);
        card.setAttribute('data-demanda-id', c.id_demanda);
        card.innerHTML =
          '<div class="pl-estudio-item-info">' +
            '<h5><i class="bi bi-person-circle" style="color: var(--prolink-blue); margin-right: 6px;"></i> ' + c.nome_usuario + '</h5>' +
            '<p>Candidatou-se a: <strong>' + c.titulo_demanda + '</strong> • ' + formatDate(c.data_interesse) + '</p>' +
          '</div>' +
          '<div class="pl-estudio-item-actions">' +
            '<button class="pl-estudio-item-btn btn-ver-portfolio" data-usuario-id="' + c.id_usuario + '" title="Ver Portfólio">' +
              '<i class="bi bi-folder2-open"></i>' +
            '</button>' +
            '<button class="pl-estudio-item-btn btn-aceitar" data-interesse-id="' + c.id + '" style="border-color: #00d278; color: #00d278;" title="Aceitar">' +
              '<i class="bi bi-check-lg"></i>' +
            '</button>' +
            '<button class="pl-estudio-item-btn pl-estudio-item-btn--danger btn-recusar" data-interesse-id="' + c.id + '" title="Recusar">' +
              '<i class="bi bi-x-lg"></i>' +
            '</button>' +
          '</div>';
        listEl.appendChild(card);
      });

      listEl.classList.remove('d-none');
      bindActions();
    }

    function bindActions() {
      document.querySelectorAll('.btn-ver-portfolio').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var userId = this.getAttribute('data-usuario-id');
          // TODO: Navegar para o portfólio público do usuário
          // window.location.hash = '#perfil?id=' + userId;
          console.log('TODO: Ver portfolio do usuário ID', userId);
        });
      });

      document.querySelectorAll('.btn-aceitar').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var interesseId = this.getAttribute('data-interesse-id');
          updateInteresseStatus(interesseId, 'ACEITA');
        });
      });

      document.querySelectorAll('.btn-recusar').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var interesseId = this.getAttribute('data-interesse-id');
          if (confirm('Tem certeza que deseja recusar este candidato?')) {
            updateInteresseStatus(interesseId, 'RECUSADA');
          }
        });
      });
    }

    /**
     * Atualiza o status da demonstração de interesse.
     * TODO: PATCH /api/demonstracoes-interesse/:id — { status: 'ACEITA' | 'RECUSADA' }
     */
    function updateInteresseStatus(interesseId, novoStatus) {
      var card = document.getElementById('candidato-' + interesseId);

      // TODO: Substituir pelo fetch real
      // fetch('/api/demonstracoes-interesse/' + interesseId, {
      //   method: 'PATCH',
      //   headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      //   body: JSON.stringify({ status: novoStatus })
      // })
      // .then(res => { if (!res.ok) throw new Error(res.statusText); return res.json(); })
      // .then(() => { onStatusChanged(card, novoStatus); })
      // .catch(err => { alert('Erro: ' + err.message); });

      // Simulação temporária
      onStatusChanged(card, novoStatus);
    }

    function onStatusChanged(cardEl, status) {
      cardEl.style.opacity = '0.4';
      cardEl.style.pointerEvents = 'none';
      var info = cardEl.querySelector('.pl-estudio-item-info p');
      if (status === 'ACEITA') {
        info.innerHTML = '<span style="color: #00d278;"><i class="bi bi-check-circle-fill"></i> Aceito</span>';
      } else {
        info.innerHTML = '<span style="color: #ff4d4d;"><i class="bi bi-x-circle-fill"></i> Recusado</span>';
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      return new Date(dateStr).toLocaleDateString('pt-BR');
    }

    // Filtro por demanda
    if (filtroEl) {
      filtroEl.addEventListener('change', function() {
        // TODO: Re-fetch com filtro: GET /api/demonstracoes-interesse?id_demanda={value}
        console.log('TODO: Filtrar por demanda ID', this.value);
      });
    }

    // Simulação temporária (remover na integração)
    setTimeout(function() {
      renderCandidatos([
        { id: 1, id_demanda: 1, id_usuario: 10, nome_usuario: 'Carlos Mendes', titulo_demanda: 'Engenheiro Civil Sênior', data_interesse: '2026-09-10', status: 'ENVIADA' },
        { id: 2, id_demanda: 1, id_usuario: 11, nome_usuario: 'Ana Paula Ribeiro', titulo_demanda: 'Engenheiro Civil Sênior', data_interesse: '2026-09-11', status: 'ENVIADA' },
        { id: 3, id_demanda: 2, id_usuario: 12, nome_usuario: 'Roberto Almeida', titulo_demanda: 'Mestre de Obras', data_interesse: '2026-09-12', status: 'EM_ANALISE' }
      ]);
    }, 600);
  })();
</script>
