version: '3.8'

services:
  web:
    image: php:8.2-apache
    container_name: prolink_web
    ports:
      - "8081:80"
    volumes:
      - ./public:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: prolink_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: prolink
      MYSQL_USER: otho_admin
      MYSQL_PASSWORD: otho_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d

volumes:
  db_data: