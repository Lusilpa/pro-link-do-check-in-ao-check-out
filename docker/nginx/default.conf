server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Projeto em desenvolvimento ativo: sem Cache-Control, o navegador guarda uma copia
    # antiga do HTML/CSS/JS (heuristica baseada em Last-Modified) e mudancas no codigo
    # parecem "nao funcionar" ate um hard refresh manual. no-cache forca sempre revalidar
    # com o servidor (If-None-Match/ETag) antes de reusar o cache.
    add_header Cache-Control "no-cache";

    # Sem fallback para index.html: esta SPA usa roteamento por hash (#feed, #cartas),
    # que o servidor nunca ve (tudo depois de "#" e client-side). Um "try_files ... /index.html"
    # aqui nao tem essa finalidade - ele so mascara arquivos genuinamente ausentes (ex:
    # lateral.html) como 200 contendo o index.html inteiro, que o jQuery .load() injeta e
    # reexecuta - reinicializando o app inteiro dentro de uma div e causando um loop.
    location / {
        try_files $uri $uri/ =404;
    }
}
